[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "drawingqa"
version = "0.1.0"
description = "Evidence-first question answering and model comparison for construction drawings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "httpx>=0.28,<0.29",
  "Pillow>=11,<14",
  "PyYAML>=6.0.2,<7",
  "python-dotenv>=1.0,<2",
  "PyMuPDF>=1.26,<2",
]

[project.optional-dependencies]
ifc = ["ifcopenshell>=0.8,<0.9"]
dxf = ["ezdxf>=1.3,<2"]
app = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "python-multipart>=0.0.20"]

[project.scripts]
drawingqa = "drawingqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drawingqa = ["app/static/*"]

